repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^docs/demo\.gif$  # the README's demo; scripts/check_no_raw_data.py still caps it at 1.5 MB
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: gitleaks
        name: no secrets in the staged changes (gitleaks)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: no-raw-data
        name: no raw email or dataset files
        entry: python scripts/check_no_raw_data.py
        language: system
        pass_filenames: true
