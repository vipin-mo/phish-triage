[project]
name = "phish-triage"
version = "0.0.1"
description = "Phishing triage with a measured cheap-model-first cascade, a grounded LLM analyst step, and serverless AWS deployment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "confusable-homoglyphs>=3.3.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "tldextract>=5.4.0",
]

[dependency-groups]
data = [
    "datasketch>=2.0.0",
]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.17",
]
eval = [
    "matplotlib>=3.11.2",
]
train = [
    "mlflow>=3.17.2",
    "onnx>=1.23.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[tool.uv]
# The data pipeline (datasketch) and report plots (matplotlib) are installed for development and CI, not at runtime.
default-groups = ["dev", "data", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phish_triage"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["./data"]  # downloaded data only; the src/phish_triage/data package is linted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "S311",  # random is used for reproducible sampling, never for secrets
]

[tool.ruff.lint.isort]
known-first-party = ["phish_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
