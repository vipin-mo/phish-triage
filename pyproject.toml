[project]
name = "phish-triage"
version = "0.0.1"
description = "Phishing triage with a measured cheap-model-first cascade, a grounded LLM analyst step, and serverless AWS deployment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
data = [
    "datasketch>=2.0.0",
]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.17",
]

[tool.uv]
# The data pipeline (datasketch) is installed for development and CI, but is not a runtime dependency.
default-groups = ["dev", "data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phish_triage"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["./data"]  # downloaded data only; the src/phish_triage/data package is linted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "S311",  # random is used for reproducible sampling, never for secrets
]

[tool.ruff.lint.isort]
known-first-party = ["phish_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
