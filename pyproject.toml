[project]
name = "phish-triage"
version = "0.0.1"
description = "Phishing triage with a measured cheap-model-first cascade, a grounded LLM analyst step, and serverless AWS deployment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phish_triage"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["phish_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
