<text x="628" y="370" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">verdict: safe · review · phish</text>
<text x="1228" y="370" font-size="12.5" font-weight="600" fill="#9a3412" text-anchor="end">stored: verdict, score, SHA-256 — never the email</text>
<rect x="608" y="400" width="640" height="118" rx="14" fill="#FBEDE7" stroke="#D97757" stroke-width="2" filter="url(#sh)"/>
<text x="624" y="426" font-size="15" font-weight="700" fill="#9a3412" text-anchor="start">Explain (only when I click)</text>
<text x="624" y="450" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="start">• hidden text removed · personal data redacted · email inside random per-request tags</text>
<text x="624" y="471" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="start">• answer must match a schema · every quote exact · every URL from the email</text>
<text x="624" y="492" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="start">• can raise a verdict, never lower it · refusal or bad answer → a person</text>
