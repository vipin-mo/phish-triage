name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the raw-data check reads every commit, not just the last one
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: No raw data in the repo
        run: |
          uv run python scripts/check_no_raw_data.py
          uv run python scripts/check_no_raw_data.py --history
      - name: Unit tests
        run: uv run pytest
      - name: Eval gate (committed numbers, no API calls)
        run: uv run python -m phish_triage.evaluation.gate --check
