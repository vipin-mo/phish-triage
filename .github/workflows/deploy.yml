name: Deploy

# Pull requests: `terraform plan` for infra/service; the resources that change are posted as a comment (read-only role,
# no data access; never the plan's text).
# Merge to main: build the Lambda image, push it, and `terraform apply`, in the `production` environment, which
# waits for my approval. AWS is reached with OIDC; no AWS keys are stored in GitHub.
# Repository variables (not secrets, but kept out of the code): AWS_PLAN_ROLE_ARN, AWS_DEPLOY_ROLE_ARN,
# TF_STATE_BUCKET, MODELS_BUCKET and, optionally, ALERT_EMAIL.
# The jobs skip themselves while the role variables are unset: the AWS Free plan doesn't allow the OIDC provider
# (infra/foundation/main.tf), so for now I deploy from my laptop with `make deploy`.

on:
  pull_request:
    paths: ["infra/**", "src/**", "pyproject.toml", "uv.lock", ".github/workflows/deploy.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "src/**", "pyproject.toml", "uv.lock", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    if: vars.AWS_PLAN_ROLE_ARN != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
      - name: Format and validate
        run: |
          terraform fmt -check -recursive infra
          terraform -chdir=infra/service init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform -chdir=infra/service validate
      - name: Plan
        # The plan's full text holds the account ID, ARNs and the alarm address, and this repo's logs and comments
        # are public, so neither shows it: only which resources change, and how.
        run: |
          terraform -chdir=infra/service plan -input=false -lock=false -no-color -out=ci.tfplan \
            -var "image_tag=${{ github.event.pull_request.head.sha }}" \
            -var "alert_email=${{ vars.ALERT_EMAIL }}" -var "ci_role_boundary=true" > /dev/null 2>&1 \
            || { echo "terraform plan failed; run make deploy-plan on the laptop to see why"; exit 1; }
          terraform -chdir=infra/service show -json ci.tfplan \
            | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join("/")) \(.address)"' \
            > changes.txt
      - name: Post the plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### terraform plan (infra/service)"
            echo "Image tag: \`${{ github.event.pull_request.head.sha }}\` (built and pushed only after merge and approval)"
            echo "Resources that change (addresses only; the full plan is never posted):"
            echo '```'
            if [ -s changes.txt ]; then cat changes.txt; else echo "No changes"; fi
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Runtime requirements and the model bundle
        run: |
          mkdir -p build/bundle
          uv export --no-default-groups --group service --no-hashes --no-emit-project --format requirements-txt -q \
            > build/requirements.txt
          aws s3 sync --only-show-errors "s3://${{ vars.MODELS_BUCKET }}/bundles/$(cat infra/bundle-version)/" build/bundle/
          test -f build/bundle/bundle.json
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
      - name: Build and push the image (once per commit; tags are immutable)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/phish-triage:${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name phish-triage --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "image already pushed"
          else
            # Lambda needs a single-platform image manifest, so no provenance or SBOM attestations.
            # Quiet: the image name holds the registry's address, which holds the account ID, and these logs are public.
            docker build -q --platform linux/arm64 --provenance=false --sbom=false -f infra/lambda.Dockerfile -t "$IMAGE" . > /dev/null
            docker push -q "$IMAGE" > /dev/null
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
      - name: Apply
        # As with the plan, the output stays out of the public log.
        run: |
          terraform -chdir=infra/service init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" > /dev/null
          terraform -chdir=infra/service apply -input=false -auto-approve -no-color \
            -var "image_tag=${{ github.sha }}" -var "alert_email=${{ vars.ALERT_EMAIL }}" -var "ci_role_boundary=true" \
            > /dev/null 2>&1 \
            || { echo "terraform apply failed; run make deploy-plan on the laptop to see why"; exit 1; }
          echo "applied"
      - name: Smoke test
        run: |
          url=$(terraform -chdir=infra/service output -raw api_url)
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 30 -o /dev/null "$url/v1/health"; then echo "healthy"; exit 0; fi
            sleep 10
          done
          exit 1
